<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" width="360" height="700" role="img" aria-labelledby="t d">
  <title id="t">Ejemplo de plantilla de WhatsApp Business</title>
  <desc id="d">Recordatorio de cita automático con botones Confirmar y Reprogramar, y la respuesta del paciente.</desc>
  <defs>
    <clipPath id="screen"><rect x="14" y="14" width="332" height="672" rx="34"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Marco del teléfono -->
  <rect x="2" y="2" width="356" height="696" rx="44" fill="#1b1f2a"/>
  <rect x="6" y="6" width="348" height="688" rx="40" fill="#0e121b"/>

  <g clip-path="url(#screen)" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Fondo del chat -->
    <rect x="14" y="14" width="332" height="672" fill="#efeae2"/>

    <!-- Barra superior -->
    <rect x="14" y="14" width="332" height="92" fill="#0b6e5f"/>
    <text x="40" y="42" font-size="12" fill="#e6f2ef" font-weight="600">9:41</text>
    <rect x="300" y="33" width="22" height="10" rx="2.5" fill="none" stroke="#e6f2ef" stroke-width="1.4"/>
    <rect x="302.5" y="35.5" width="14" height="5" rx="1" fill="#e6f2ef"/>
    <path d="M36 78 l8 -8 M36 78 l8 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="72" cy="78" r="17" fill="#e8f5f2"/>
    <path d="M65 78 h14 M72 71 v14" stroke="#0b6e5f" stroke-width="3.4" stroke-linecap="round"/>
    <text x="98" y="74" font-size="15" font-weight="600" fill="#ffffff">Clínica Ejemplo</text>
    <text x="98" y="92" font-size="11.5" fill="#cfe7e1">Cuenta de empresa</text>

    <!-- Fecha -->
    <rect x="152" y="122" width="56" height="22" rx="7" fill="#ffffff" filter="url(#sh)"/>
    <text x="180" y="137" font-size="11" fill="#54656f" text-anchor="middle" font-weight="600">HOY</text>

    <!-- Plantilla (mensaje de la empresa) -->
    <g filter="url(#sh)">
      <rect x="28" y="160" width="262" height="236" rx="10" fill="#ffffff"/>
    </g>
    <rect x="40" y="172" width="238" height="34" rx="7" fill="#e7f6f2"/>
    <text x="52" y="194" font-size="13.5" font-weight="700" fill="#0b6e5f">Recordatorio de cita</text>
    <text font-size="13.5" fill="#111b21">
      <tspan x="42" y="228">Hola María, te recordamos tu cita de</tspan>
      <tspan x="42" y="248" font-weight="700">Medicina General</tspan>
      <tspan x="42" y="268">el <tspan font-weight="700">jueves 25/09</tspan> a las <tspan font-weight="700">10:30 a. m.</tspan></tspan>
      <tspan x="42" y="296">¿Confirmas tu asistencia?</tspan>
    </text>
    <text x="42" y="322" font-size="11" fill="#8696a0">Mensaje automático</text>
    <text x="278" y="322" font-size="11" fill="#8696a0" text-anchor="end">10:02</text>
    <line x1="28" y1="334" x2="290" y2="334" stroke="#e9edef"/>
    <text x="159" y="358" font-size="14" fill="#027eb5" text-anchor="middle" font-weight="600">✓  Confirmar</text>
    <line x1="28" y1="370" x2="290" y2="370" stroke="#e9edef"/>
    <text x="159" y="389" font-size="14" fill="#027eb5" text-anchor="middle" font-weight="600">Reprogramar</text>

    <!-- Respuesta del paciente (tocó el botón) -->
    <g filter="url(#sh)">
      <rect x="196" y="412" width="136" height="44" rx="10" fill="#d9fdd3"/>
    </g>
    <text x="210" y="439" font-size="14" fill="#111b21">Confirmar</text>
    <text x="302" y="449" font-size="10.5" fill="#667781" text-anchor="end">10:05</text>
    <text x="324" y="449" font-size="11" fill="#53bdeb" text-anchor="end" font-weight="700">✓✓</text>

    <!-- Respuesta automática -->
    <g filter="url(#sh)">
      <rect x="28" y="472" width="250" height="72" rx="10" fill="#ffffff"/>
    </g>
    <text font-size="13.5" fill="#111b21">
      <tspan x="42" y="498">¡Listo, María! Tu cita quedó</tspan>
      <tspan x="42" y="518">confirmada. Te esperamos.</tspan>
    </text>
    <text x="266" y="536" font-size="10.5" fill="#667781" text-anchor="end">10:05</text>

    <!-- Barra de escritura -->
    <rect x="24" y="632" width="262" height="42" rx="21" fill="#ffffff"/>
    <text x="48" y="658" font-size="13.5" fill="#8696a0">Mensaje</text>
    <circle cx="314" cy="653" r="21" fill="#0b6e5f"/>
    <path d="M306 653 l16 -7 l-5 7 l5 7 z" fill="#ffffff"/>
  </g>
</svg>
